name : Refresh snippet sweep report

on :
  push :
    branches : [main]
    paths :
      - 'bundle/**'
      - 'resources/markdown/13.x/**'
      - 'resources/ts/components/Snippet.vue'
      - 'resources/ts/runtime/**'
      - 'app/Console/Commands/**'
      - 'tests/snippets.spec.ts'
      - 'playwright.config.ts'
  schedule :
    - cron : '0 6 * * 1'
  workflow_dispatch :

permissions :
  contents : read
  actions : read

concurrency :
  group : sweep
  cancel-in-progress : false

jobs :
  sweep :
    runs-on : ubuntu-latest
    timeout-minutes : 60
    steps :
      - name : Checkout
        uses : actions/checkout@v4

      - name : Setup PHP 8.5
        uses : shivammathur/setup-php@v2
        with :
          php-version : '8.5'
          extensions : mbstring, intl, xml, zip, dom
          coverage : none
          tools : composer:v2

      - name : Setup Node 24
        uses : actions/setup-node@v4
        with :
          node-version : '24'
          cache : npm
          cache-dependency-path : package.json

      - name : Composer install
        run : composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name : NPM install
        run : npm install

      - name : Resolve Playwright version
        id : playwright-version
        run : |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name : Cache Playwright browsers
        id : playwright-cache
        uses : actions/cache@v4
        with :
          path : ~/.cache/ms-playwright
          key : playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name : Install Playwright chromium
        if : steps.playwright-cache.outputs.cache-hit != 'true'
        run : npx playwright install chromium --with-deps

      - name : Prepare Laravel environment
        env :
          TORCHLIGHT_TOKEN: ${{ secrets.TORCHLIGHT_TOKEN }}
        run : |
          cp .env.example .env
          sed -i "s|^TORCHLIGHT_TOKEN=.*|TORCHLIGHT_TOKEN=${TORCHLIGHT_TOKEN}|" .env
          php artisan key:generate


      - name : Prepare bundle environment
        working-directory : bundle
        run : |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name : Fetch latest laravel docs markdown
        env :
          GH_TOKEN : ${{ github.token }}
        run : |
          set -e
          mkdir -p resources/markdown/13.x
          LATEST_RUN_ID=$(gh run list \
            --workflow=sync-docs.yml \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$LATEST_RUN_ID" ]; then
            echo "Downloading laravel-docs-markdown from sync-docs run #$LATEST_RUN_ID"
            TMPDIR=$(mktemp -d)
            trap 'rm -rf "$TMPDIR"' EXIT
            if gh run download "$LATEST_RUN_ID" \
                --name laravel-docs-markdown \
                --dir "$TMPDIR" \
                --repo "$GITHUB_REPOSITORY"; then
              cp -fR "$TMPDIR"/. resources/markdown/13.x/
            fi
          fi
          if [ -z "$(ls resources/markdown/13.x/*.md 2>/dev/null)" ]; then
            echo "No markdown artifact available — fetching the corpus from upstream via sync:docs."
            php artisan sync:docs
          fi
          if [ -z "$(ls resources/markdown/13.x/*.md 2>/dev/null)" ]; then
            echo "::error::No markdown corpus available — nothing to sweep."
            exit 1
          fi

      - name : Build production assets
        env :
          SWEEP : '1'
        run : composer build

      - name : Start php artisan serve
        run : |
          nohup env PHP_CLI_SERVER_WORKERS=4 php artisan serve --port=8000 </dev/null >/tmp/artisan.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000 >/dev/null 2>&1; then
              echo "artisan ready in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "artisan failed to bind to :8000 within 60s"
          tail -n 200 /tmp/artisan.log || true
          exit 1

      - name : Run playwright snippet sweep
        run : npx playwright test

      - name : Merge sweep results
        if : always()
        run : php artisan report:merge

      - name : Guard against zero-result sweep
        run : |
          node -e '
            const fs = require("node:fs");
            const results = JSON.parse(fs.readFileSync( "tests/report.json", "utf8" ) );
            if (!Array.isArray(results) || results.length === 0) {
              console.error( "::error::Sweep produced 0 results — refusing to deploy. Check the artisan-log artifact + Playwright stdout for the root cause." );
              process.exit(1);
            }
            console.log( `Sweep produced ${results.length} results — guard passed.` );
          '

      - name : Upload snippet-report artifact
        uses : actions/upload-artifact@v4
        with :
          name : snippet-report
          path : tests/report.json
          retention-days : 90
          if-no-files-found : error
