name : Sync laravel docs assets

on :
  schedule :
    - cron : '0 6 * * *'
  workflow_dispatch :

permissions :
  contents : read

concurrency :
  group : sync-assets
  cancel-in-progress : false

jobs :
  refresh :
    runs-on : ubuntu-latest
    steps :
      - name : Checkout
        uses : actions/checkout@v4

      - name : Setup PHP 8.5
        uses : shivammathur/setup-php@v2
        with :
          php-version : '8.5'
          extensions : mbstring, intl, xml, zip, dom
          coverage : none
          tools : composer:v2

      - name : Composer install
        run : composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name : Prepare Laravel environment
        run : cp .env.example .env

      - name : Sync laravel.com docs CSS + fonts
        run : php artisan sync:assets

      - name : Detect changes vs committed baseline
        id : diff
        run : |
          if git diff --quiet --exit-code public/laravel-docs.css public/laravel-docs-assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CSS or font changes — uploading empty artifact would mask a deploy-time fetch failure, skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat public/laravel-docs.css public/laravel-docs-assets
          fi

      - name : Upload laravel-docs-assets artifact
        if : steps.diff.outputs.changed == 'true'
        uses : actions/upload-artifact@v4
        with :
          name : laravel-docs-assets
          path : |
            public/laravel-docs.css
            public/laravel-docs-assets/**
          retention-days : 90
          if-no-files-found : error
