name : Sync laravel docs markdown

on :
  schedule :
    - cron : '0 6 * * *'
  workflow_dispatch :

permissions :
  contents : read

concurrency :
  group : sync-docs
  cancel-in-progress : false

jobs :
  refresh :
    runs-on : ubuntu-latest
    steps :
      - name : Checkout
        uses : actions/checkout@v4

      - name : Setup PHP 8.5
        uses : shivammathur/setup-php@v2
        with :
          php-version : '8.5'
          extensions : mbstring, intl, xml, zip, dom
          coverage : none
          tools : composer:v2

      - name : Composer install
        run : composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name : Prepare Laravel environment
        run : cp .env.example .env

      - name : Sync laravel/docs 13.x markdown
        env :
          GITHUB_TOKEN : ${{ github.token }}
        run : php artisan sync:docs

      - name : Upload laravel-docs-markdown artifact
        uses : actions/upload-artifact@v4
        with :
          name : laravel-docs-markdown
          path : resources/markdown/13.x/**
          retention-days : 90
          if-no-files-found : error
