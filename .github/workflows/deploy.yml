name : Deploy to GitHub Pages

on :
  push :
    branches : [main]
  workflow_run :
    workflows :
      - 'Refresh snippet sweep report'
      - 'Sync laravel docs assets'
      - 'Sync laravel docs markdown'
    types : [completed]
  workflow_dispatch :

permissions :
  contents : read
  pages : write
  id-token : write
  actions : read

concurrency :
  group : pages
  cancel-in-progress : false

jobs :
  gate :
    if : ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on : ubuntu-latest
    outputs :
      proceed : ${{ steps.check.outputs.proceed }}
    steps :
      - name : Skip deploy when the triggering run produced no artifact
        id : check
        env :
          GH_TOKEN : ${{ github.token }}
        run : |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" --jq '.total_count')
          if [ "$COUNT" -eq 0 ]; then
            echo "Triggering run of '${{ github.event.workflow_run.name }}' uploaded no artifact (no upstream changes) — skipping deploy."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build :
    needs : gate
    if : ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on : ubuntu-latest
    steps :
      - name : Checkout
        uses : actions/checkout@v4

      - name : Setup PHP 8.5
        uses : shivammathur/setup-php@v2
        with :
          php-version : '8.5'
          extensions : mbstring, intl, xml, zip, dom
          coverage : none
          tools : composer:v2

      - name : Setup Node 24
        uses : actions/setup-node@v4
        with :
          node-version : '24'
          cache : npm
          cache-dependency-path : package.json

      - name : Composer install
        run : composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name : NPM install
        run : npm install

      - name : Prepare Laravel environment
        env :
          TORCHLIGHT_TOKEN: ${{ secrets.TORCHLIGHT_TOKEN }}
        run : |
          cp .env.example .env
          sed -i 's|^ASSET_URL=.*|ASSET_URL=/laravel-snippets|' .env
          sed -i "s|^TORCHLIGHT_TOKEN=.*|TORCHLIGHT_TOKEN=${TORCHLIGHT_TOKEN}|" .env
          php artisan key:generate

      - name : Fetch latest sweep report
        env :
          GH_TOKEN : ${{ github.token }}
        run : |
          set -e
          LATEST_RUN_ID=$(gh run list \
            --workflow=sweep.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful sweep runs found — /report will render its empty state."
            exit 0
          fi
          echo "Downloading snippet-report from sweep run #$LATEST_RUN_ID"
          if ! gh run download "$LATEST_RUN_ID" \
              --name snippet-report \
              --dir tests/ \
              --repo "$GITHUB_REPOSITORY"; then
            echo "::warning::snippet-report artifact not found on run #$LATEST_RUN_ID (likely expired) — /report will render its empty state."
          fi

      - name : Fetch latest laravel docs assets
        env :
          GH_TOKEN : ${{ github.token }}
        run : |
          set -e
          LATEST_RUN_ID=$(gh run list \
            --workflow=sync-assets.yml \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful sync-assets runs found — using committed laravel-docs.css + fonts baseline."
            exit 0
          fi
          echo "Downloading laravel-docs-assets from sync-assets run #$LATEST_RUN_ID"
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          if gh run download "$LATEST_RUN_ID" \
              --name laravel-docs-assets \
              --dir "$TMPDIR" \
              --repo "$GITHUB_REPOSITORY"; then
            cp -fR "$TMPDIR"/. public/
          else
            echo "::warning::laravel-docs-assets artifact not found on run #$LATEST_RUN_ID (likely expired) — falling back to committed baseline."
          fi

      - name : Fetch latest laravel docs markdown
        env :
          GH_TOKEN: ${{ github.token }}
        run : |
          set -e
          mkdir -p resources/markdown/13.x
          LATEST_RUN_ID=$(gh run list \
            --workflow=sync-docs.yml \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$LATEST_RUN_ID" ]; then
            echo "Downloading laravel-docs-markdown from sync-docs run #$LATEST_RUN_ID"
            TMPDIR=$(mktemp -d)
            trap 'rm -rf "$TMPDIR"' EXIT
            if gh run download "$LATEST_RUN_ID" \
                --name laravel-docs-markdown \
                --dir "$TMPDIR" \
                --repo "$GITHUB_REPOSITORY"; then
              cp -fR "$TMPDIR"/. resources/markdown/13.x/
            fi
          fi
          if [ -z "$(ls resources/markdown/13.x/*.md 2>/dev/null)" ]; then
            echo "No markdown artifact available — fetching the corpus from upstream via sync:docs."
            php artisan sync:docs
          fi
          if [ -z "$(ls resources/markdown/13.x/*.md 2>/dev/null)" ]; then
            echo "::error::No markdown corpus available — refusing to build an empty site."
            exit 1
          fi

      - name : Prepare bundle environment
        working-directory : bundle
        run : |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name : Build static site
        run : php artisan page:deploy

      - name : Upload Pages artifact
        uses : actions/upload-pages-artifact@v3
        with :
          path : dist

  deploy :
    needs : build
    runs-on : ubuntu-latest
    environment :
      name : github-pages
      url : ${{ steps.deployment.outputs.page_url }}
    steps :
      - name : Deploy to GitHub Pages
        id : deployment
        uses : actions/deploy-pages@v4
